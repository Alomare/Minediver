[package]
name = "minediver"
version = "0.1.0"
description = "Minediver: Helldivers (2015) asset extractor and mod builder"
edition = "2024"
publish = false
repository = "https://github.com/Alomare/Minediver"

[lib]
name = "minediver_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
minediver-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1.12"
