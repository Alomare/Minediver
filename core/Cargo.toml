[package]
name = "minediver-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "minediver"
path = "src/lib.rs"

[[bin]]
name = "minediver-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", features = ["zlib-rs"] }
png = "0.18"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1.2"
globset = "0.4"
